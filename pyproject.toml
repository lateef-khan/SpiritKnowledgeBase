[project]
name = "kb"
version = "0.1.0"
description = "Knowledge bank CLI: Markdown cards to Qdrant"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "qdrant-client>=1.19",
    "openai==2.12.0",
    "python-dotenv>=1.0",
]

[project.scripts]
kb = "kb.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live Qdrant on localhost:6333"]
addopts = "-m 'not integration'"
