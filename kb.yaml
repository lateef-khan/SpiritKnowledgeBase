collection: kb

embedding:
  model: text-embedding-3-small
  dimensions: 1024

kinds: [fact, procedure, troubleshooting, policy, spec, definition]

facets:
  brand:
    index: keyword
    array: true
    values: [sole, spirit]
  product_line:
    index: keyword
    values: [treadmill, bike, elliptical, rower, strength, "*"]
  model:
    index: keyword
    values: ["*"]
  applies_to:
    index: keyword
    array: true
  section:
    index: keyword
    values: [safety, assembly, console, programs, errors, maintenance, specs, warranty, policy, returns]
  code:
    index: keyword

models:
  spirit: [ct900, ct900ent, ctsbs900]
  sole:
    - e35
    - e95
    - e95s
    - e98
    - f63
    - f63-2013
    - f63-2023
    - f63-2026
    - f65
    - f65-2023
    - f65-2026
    - f80
    - f80-2023
    - f80-2026
    - f83
    - f83-2026
    - f85
    - f85-2019
    - f85-2020
    - f85-2021
    - f85-2023
    - f85-2026
    - f89
    - f89-2023
    - lcb
    - lcr
    - sb1200
    - srvo
    - st90
    - st90-2020
    - st90-2021
    - tt8
    - tt8-2019
    - tt8-2020
    - tt8-2023
    - tt9

payload_indexes:
  text:
    index: text
    tokenizer: word
    lowercase: true
    min_token_len: 1
    max_token_len: 30
  card_id:
    index: keyword
  kind:
    index: keyword
  authority:
    index: integer

ingest:
  pdf_command: "pdftotext -layout {input} {output}"
